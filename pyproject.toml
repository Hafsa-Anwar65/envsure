[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "envsure"
version = "0.1.0"
description = "Keep .env files honest: validate against .env.example, keep it in sync, and catch leaked API keys before you commit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hafsa Anwar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["dotenv", "env", "environment-variables", "config", "validation", "secrets", "pre-commit", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Hafsa-Anwar65/envsure"
Issues = "https://github.com/Hafsa-Anwar65/envsure/issues"

[project.scripts]
envsure = "envsure.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/envsure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"
