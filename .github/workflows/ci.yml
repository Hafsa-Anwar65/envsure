name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=envsure --cov-report=term-missing
      - name: Dogfood — scan this repo for leaked secrets
        run: envsure scan src examples README.md
      - name: Dogfood — validate the example project
        run: envsure check --env examples/.env.sample --example examples/.env.example
