name: envsure
description: Validate environment variables against .env.example and scan for leaked secrets.
author: Hafsa Anwar
branding:
  icon: shield
  color: green
inputs:
  command:
    description: "check or scan"
    default: check
  example:
    description: Path to the annotated .env.example
    default: .env.example
  paths:
    description: Paths to scan (for command=scan)
    default: "."
  args:
    description: Extra arguments, e.g. --strict
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      env:
        ENVSURE_COMMAND: ${{ inputs.command }}
        ENVSURE_EXAMPLE: ${{ inputs.example }}
        ENVSURE_PATHS: ${{ inputs.paths }}
        ENVSURE_ARGS: ${{ inputs.args }}
      run: |
        if [ "$ENVSURE_COMMAND" = "scan" ]; then
          envsure scan $ENVSURE_PATHS $ENVSURE_ARGS
        else
          envsure check --no-file --example "$ENVSURE_EXAMPLE" $ENVSURE_ARGS
        fi
